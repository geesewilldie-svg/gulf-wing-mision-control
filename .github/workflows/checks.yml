name: Mission Control checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, types, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production application
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm test -- --reporter=line,html --trace=retain-on-failure
      - name: Test local Nexus model and voice protocols
        run: npm run test:nexus-runtime
      - name: Test optional Python voice worker protocol
        run: python scripts/voice/test_worker.py
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
